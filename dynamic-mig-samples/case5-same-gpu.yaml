apiVersion: v1
kind: Namespace
metadata:
  name: dynamic-mig-jobs
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mig-test-service-account
  namespace: dynamic-mig-jobs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mig-test-anyuid-scc-binding
subjects:
- kind: ServiceAccount
  name: mig-test-service-account
  namespace: dynamic-mig-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
---
# Constraints with matchAttribute ensure all slices come from the same parent GPU.
# An empty requests list means the constraint applies to all requests.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: mig-claim-same-gpu
  namespace: dynamic-mig-jobs
spec:
  spec:
    devices:
      requests:
      - name: mig1
        exactly:
          deviceClassName: mig.nvidia.com
      - name: mig2
        exactly:
          deviceClassName: mig.nvidia.com
      constraints:
      - requests: []
        matchAttribute: "gpu.nvidia.com/parentUUID"
---
apiVersion: v1
kind: Pod
metadata:
  name: mig-same-gpu
  namespace: dynamic-mig-jobs
spec:
  restartPolicy: Never
  serviceAccountName: mig-test-service-account
  containers:
  - name: ctr0
    image: ubuntu:24.04
    command: ["nvidia-smi", "-L"]
    securityContext:
      runAsUser: 1000
    resources:
      claims:
      - name: mig-slices
        request: mig1
  - name: ctr1
    image: ubuntu:24.04
    command: ["nvidia-smi", "-L"]
    securityContext:
      runAsUser: 1000
    resources:
      claims:
      - name: mig-slices
        request: mig2
  resourceClaims:
  - name: mig-slices
    resourceClaimTemplateName: mig-claim-same-gpu
