apiVersion: v1
kind: Namespace
metadata:
  name: dynamic-mig-samples
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mig-test-service-account
  namespace: dynamic-mig-samples
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mig-test-anyuid-scc-binding
subjects:
- kind: ServiceAccount
  name: mig-test-service-account
  namespace: dynamic-mig-samples
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: mig-claim-profile
  namespace: dynamic-mig-samples
spec:
  spec:
    devices:
      requests:
      - name: mig
        exactly:
          deviceClassName: mig.nvidia.com
          selectors:
          - cel:
              # Adjust profile for your GPU model (H100 SXM: 1g.10gb, H200 SXM: 1g.18gb)
              expression: "device.attributes['gpu.nvidia.com'].profile == '1g.18gb'"
---
apiVersion: v1
kind: Pod
metadata:
  name: mig-profile
  namespace: dynamic-mig-samples
spec:
  restartPolicy: Never
  serviceAccountName: mig-test-service-account
  containers:
  - name: ctr
    image: ubuntu:24.04
    command: ["nvidia-smi", "-L"]
    securityContext:
      runAsUser: 1000
    resources:
      claims:
      - name: migdev
  resourceClaims:
  - name: migdev
    resourceClaimTemplateName: mig-claim-profile
