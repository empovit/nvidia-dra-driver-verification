apiVersion: v1
kind: Namespace
metadata:
  name: dynamic-mig-jobs
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mig-test-service-account
  namespace: dynamic-mig-jobs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mig-test-anyuid-scc-binding
subjects:
- kind: ServiceAccount
  name: mig-test-service-account
  namespace: dynamic-mig-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
---
# Selects a 2g-equivalent slice or larger on H100/H200 and later GPUs.
# Prefer capacity selectors over hard-coded profile names — they work across GPU generations.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: mig-claim-capacity
  namespace: dynamic-mig-jobs
spec:
  spec:
    devices:
      requests:
      - name: mig
        exactly:
          deviceClassName: mig.nvidia.com
          selectors:
          - cel:
              expression: |
                device.capacity['gpu.nvidia.com'].memory.isGreaterThan(quantity("10Gi"))
                &&
                device.capacity['gpu.nvidia.com'].multiprocessors.isGreaterThan(quantity("14"))
---
apiVersion: v1
kind: Pod
metadata:
  name: mig-capacity
  namespace: dynamic-mig-jobs
spec:
  restartPolicy: Never
  serviceAccountName: mig-test-service-account
  containers:
  - name: ctr
    image: ubuntu:24.04
    command: ["nvidia-smi", "-L"]
    securityContext:
      runAsUser: 1000
    resources:
      claims:
      - name: migdev
  resourceClaims:
  - name: migdev
    resourceClaimTemplateName: mig-claim-capacity
