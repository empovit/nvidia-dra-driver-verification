apiVersion: v1
kind: Namespace
metadata:
  name: dynamic-mig-samples
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mig-test-service-account
  namespace: dynamic-mig-samples
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mig-test-anyuid-scc-binding
subjects:
- kind: ServiceAccount
  name: mig-test-service-account
  namespace: dynamic-mig-samples
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
---
# Multiple MIG slices in one pod: use a single ResourceClaimTemplate with multiple requests.
# Each container references the shared claim with a specific request name.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: mig-claim-multi
  namespace: dynamic-mig-samples
spec:
  spec:
    devices:
      requests:
      - name: mig-small
        exactly:
          deviceClassName: mig.nvidia.com
          selectors:
          - cel:
              # H100 SXM: 1g.10gb  H200 SXM: 1g.18gb
              expression: "device.attributes['gpu.nvidia.com'].profile == '1g.18gb'"
      - name: mig-large
        exactly:
          deviceClassName: mig.nvidia.com
          selectors:
          - cel:
              # H100 SXM: 2g.20gb  H200 SXM: 2g.35gb
              expression: "device.attributes['gpu.nvidia.com'].profile == '2g.35gb'"
---
apiVersion: v1
kind: Pod
metadata:
  name: mig-multi
  namespace: dynamic-mig-samples
spec:
  restartPolicy: Never
  serviceAccountName: mig-test-service-account
  containers:
  - name: ctr0
    image: ubuntu:24.04
    command: ["nvidia-smi", "-L"]
    securityContext:
      runAsUser: 1000
    resources:
      claims:
      - name: migdevs
        request: mig-small
  - name: ctr1
    image: ubuntu:24.04
    command: ["nvidia-smi", "-L"]
    securityContext:
      runAsUser: 1000
    resources:
      claims:
      - name: migdevs
        request: mig-large
  resourceClaims:
  - name: migdevs
    resourceClaimTemplateName: mig-claim-multi
