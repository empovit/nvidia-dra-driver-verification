name: Build and Push Compute Domain Simulator

on:
  push:
    paths:
      - 'compute-domain-simulator/**'
  pull_request:
    paths:
      - 'compute-domain-simulator/**'
  workflow_dispatch:
    inputs:
      dra_version:
        description: 'DRA Driver Version (e.g., 25.8.0)'
        required: true
        type: string
      push_image:
        description: 'Push image to registry'
        required: false
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/compute-domain-simulator

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Determine version
      id: version
      run: |
        cd compute-domain-simulator
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.dra_version }}"
          echo "$VERSION" > VERSION
          echo "Using manual version: $VERSION"
        else
          VERSION=$(cat VERSION)
          echo "Using version from file: $VERSION"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$VERSION" >> $GITHUB_OUTPUT

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=raw,value=${{ steps.version.outputs.tag }}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build simulator image
      uses: docker/build-push-action@v5
      with:
        context: ./compute-domain-simulator
        platforms: linux/amd64,linux/arm64
        push: false
        load: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          VERSION=v${{ steps.version.outputs.version }}
          DRIVER_VERSION=${{ steps.version.outputs.version }}
          BASE_IMAGE=nvcr.io/nvidia/k8s-dra-driver-gpu:v${{ steps.version.outputs.version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build for validation (single platform)
      uses: docker/build-push-action@v5
      with:
        context: ./compute-domain-simulator
        platforms: linux/amd64
        push: false
        load: true
        tags: localhost/compute-domain-simulator:v${{ steps.version.outputs.version }}
        build-args: |
          VERSION=v${{ steps.version.outputs.version }}
          DRIVER_VERSION=${{ steps.version.outputs.version }}
          BASE_IMAGE=nvcr.io/nvidia/k8s-dra-driver-gpu:v${{ steps.version.outputs.version }}

    - name: Validate simulator
      run: |
        cd compute-domain-simulator
        CONTAINER_CMD=docker \
        BASE_IMAGE=nvcr.io/nvidia/k8s-dra-driver-gpu:v${{ steps.version.outputs.version }} \
        SIMULATOR_IMAGE=localhost/compute-domain-simulator:v${{ steps.version.outputs.version }} \
        ./validate-against-driver.sh

    - name: Push image
      if: github.event_name != 'pull_request' && (github.event.inputs.push_image != 'false')
      uses: docker/build-push-action@v5
      with:
        context: ./compute-domain-simulator
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          VERSION=v${{ steps.version.outputs.version }}
          DRIVER_VERSION=${{ steps.version.outputs.version }}
          BASE_IMAGE=nvcr.io/nvidia/k8s-dra-driver-gpu:v${{ steps.version.outputs.version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Update VERSION file (if manually triggered)
      if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      run: |
        cd compute-domain-simulator
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add VERSION
        git diff --staged --quiet || git commit -m "Update VERSION to ${{ steps.version.outputs.version }}"
        git push
