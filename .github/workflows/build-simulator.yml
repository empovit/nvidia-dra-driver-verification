name: Build and Push Compute Domain Simulator

on:
  push:
    branches:
      - main
    paths:
      - 'compute-domain-simulator/**'
  workflow_dispatch:
    inputs:
      dra_version:
        description: 'DRA Driver Version (e.g., 25.8.0) - leave empty to use current VERSION file'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/compute-domain-simulator

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Determine version
      id: version
      run: |
        cd compute-domain-simulator
        if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.dra_version }}" ]; then
          VERSION="${{ github.event.inputs.dra_version }}"
          echo "Using custom version: $VERSION"
        else
          VERSION=$(cat VERSION)
          echo "Using version from file: $VERSION"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Build simulator image for validation
      uses: docker/build-push-action@v5
      with:
        context: ./compute-domain-simulator
        platforms: linux/amd64
        push: false
        load: true
        tags: localhost/compute-domain-simulator:v${{ steps.version.outputs.version }}
        build-args: |
          VERSION=v${{ steps.version.outputs.version }}
          DRIVER_VERSION=${{ steps.version.outputs.version }}
          BASE_IMAGE=nvcr.io/nvidia/k8s-dra-driver-gpu:v${{ steps.version.outputs.version }}

    - name: Validate simulator against actual compute-domain implementation
      run: |
        cd compute-domain-simulator
        CONTAINER_CMD=docker \
        BASE_IMAGE=nvcr.io/nvidia/k8s-dra-driver-gpu:v${{ steps.version.outputs.version }} \
        SIMULATOR_IMAGE=localhost/compute-domain-simulator:v${{ steps.version.outputs.version }} \
        ./validate-against-driver.sh

    - name: Build and push final image
      uses: docker/build-push-action@v5
      with:
        context: ./compute-domain-simulator
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ steps.version.outputs.version }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        build-args: |
          VERSION=v${{ steps.version.outputs.version }}
          DRIVER_VERSION=${{ steps.version.outputs.version }}
          BASE_IMAGE=nvcr.io/nvidia/k8s-dra-driver-gpu:v${{ steps.version.outputs.version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Image pushed
      run: echo "✅ Pushed ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ steps.version.outputs.version }}"
